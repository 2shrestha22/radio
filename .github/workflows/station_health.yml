name: Station Health Check

on:
  schedule:
    - cron: '0 6 * * 1' # every Monday at 6 AM UTC
  workflow_dispatch: # manual trigger

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install aiohttp

      - name: Run station health check
        run: python scripts/check_stations.py || true

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet assets/radio_list.json && exit 0
          git add assets/radio_list.json
          git commit -m "update station health status"
          git push
